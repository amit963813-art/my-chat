<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WhatsApp</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#0b141a;color:#e9edef;display:flex;justify-content:center;height:100dvh;overflow:hidden}
.app{width:100%;max-width:480px;background:#0b141a;display:flex;flex-direction:column;height:100%;position:relative}
.scr{display:none;flex-direction:column;height:100%;background:#111b21}
#s-wel{display:flex;justify-content:space-between;align-items:center;padding:50px 24px 36px;text-align:center}
.w-circle{width:160px;height:160px;border-radius:50%;background:#00a88422;border:2px dashed #00a884;display:flex;align-items:center;justify-content:center;font-size:68px;margin:20px auto}
.w-btn{width:100%;padding:14px;border-radius:24px;border:none;background:#00a884;color:#111b21;font-weight:700;font-size:15px}
#s-num,#s-prof{padding:36px 24px;justify-content:space-between;text-align:center}
.num-row{display:flex;gap:10px;border-bottom:2px solid #00a884;padding:8px 4px;margin:28px auto;max-width:280px;font-size:18px}
.num-row input,.p-inp{background:transparent;border:none;color:#fff;font-size:18px;outline:none;width:100%}
.p-inp{border-bottom:2px solid #00a884;max-width:280px;margin:24px auto;text-align:center;padding:8px}
.wa-head{background:#111b21;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.wa-tabs{display:flex;background:#111b21;border-bottom:1px solid #222e35}
.wa-tab{flex:1;text-align:center;padding:12px 0;font-size:14px;font-weight:600;color:#8696a0}
.wa-tab.act{color:#00a884;border-bottom:3px solid #00a884}
.chat-list{flex:1;overflow-y:auto;background:#0b141a}
.c-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #182229}
.av{width:44px;height:44px;border-radius:50%;background:#00a884;color:#111b21;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px;flex-shrink:0}
.fab{position:absolute;right:18px;bottom:22px;width:56px;height:56px;border-radius:16px;background:#00a884;color:#111b21;border:none;font-size:26px;font-weight:bold}
.top{background:#202c33;padding:8px 10px;display:flex;justify-content:space-between;align-items:center}
.msgs{flex:1;padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;background:#0b141a}
.m{max-width:80%;padding:7px 10px;border-radius:8px;font-size:14.5px;word-wrap:break-word}
.me{background:#005c4b;align-self:flex-end}
.other{background:#202c33;align-self:flex-start}
.snd{font-size:11px;color:#53bdeb;font-weight:bold;margin-bottom:2px}
.tm{font-size:10px;color:#aebac1;text-align:right;margin-top:3px}
.m img{max-width:100%;border-radius:6px;margin-top:4px;display:block}
.m audio{max-width:210px;height:34px;margin-top:4px}
.q{background:rgba(0,0,0,.3);border-left:3px solid #00a884;padding:3px 6px;font-size:12px;margin-bottom:4px;border-radius:4px}
#rbar{display:none;background:#1f2c34;padding:6px 12px;border-left:4px solid #00a884;justify-content:space-between;font-size:12px}
#ebar{display:none;background:#1f2c34;padding:8px;flex-wrap:wrap;gap:8px;font-size:22px}
.bar{background:#0b141a;padding:6px 8px;display:flex;gap:6px;align-items:center}
.inp{flex:1;background:#202c33;border-radius:24px;display:flex;align-items:center;padding:4px 10px}
.inp input{flex:1;background:transparent;border:none;color:#fff;font-size:15px;padding:8px 4px;outline:none;min-width:0}
.ic{background:none;border:none;color:#aebac1;font-size:19px;padding:5px}
.go{width:44px;height:44px;border-radius:50%;border:none;background:#00a884;color:#111b21;font-size:18px;font-weight:bold}
#call-ui{display:none;position:fixed;inset:0;background:#0b141a;z-index:99;flex-direction:column;justify-content:space-between;align-items:center;padding:30px 20px}
#remote-vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#0b141a;z-index:1}
#local-vid{position:absolute;top:20px;right:16px;width:110px;height:155px;object-fit:cover;border-radius:12px;border:2px solid #00a884;z-index:3;transform:scaleX(-1)}
.call-info,.call-ctrls{position:relative;z-index:4;background:rgba(11,20,26,.75);padding:12px 22px;border-radius:24px;text-align:center}
.call-ctrls{display:flex;gap:16px}
.cbtn{width:52px;height:52px;border-radius:50%;border:none;font-size:21px;color:#fff}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:60;align-items:center;justify-content:center;padding:24px}
.mcard{background:#202c33;padding:20px;border-radius:14px;width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px}
.mcard input{padding:12px;border-radius:8px;border:1px solid #2a3942;background:#111b21;color:#fff;font-size:16px;outline:none}
</style>
</head>
<body>
<div class="app">
  <div id="s-wel" class="scr">
    <div><div class="w-circle">💬</div><h2>Welcome to WhatsApp</h2><p style="font-size:13px;color:#8696a0;margin-top:8px">Tap Agree and continue to start.</p></div>
    <button class="w-btn" onclick="goScr('s-num')">Agree and continue</button>
  </div>
  <div id="s-num" class="scr">
    <div><h3 style="color:#00a884">Enter your phone number</h3><div class="num-row"><span style="color:#00a884">+91</span><input id="my-num" type="tel" maxlength="10" placeholder="10-digit number"></div></div>
    <button class="w-btn" onclick="saveNum()">Next</button>
  </div>
  <div id="s-prof" class="scr">
    <div><h3 style="color:#00a884">Profile info</h3><input id="my-name" class="p-inp" placeholder="Type your name"></div>
    <button class="w-btn" onclick="finishSetup()">Next</button>
  </div>
  <div id="s-home" class="scr">
    <div class="wa-head"><h1>WhatsApp</h1><div><button class="ic" onclick="openNewChat()">💬</button><button class="ic" onclick="logoutWA()">⋮</button></div></div>
    <div class="wa-tabs"><div class="wa-tab act">Chats</div><div class="wa-tab">Updates</div><div class="wa-tab">Calls</div></div>
    <div class="chat-list" id="clist"></div>
    <button class="fab" onclick="openNewChat()">+</button>
  </div>
  <div id="s-chat" class="scr">
    <div class="top">
      <div style="display:flex;align-items:center;gap:8px"><button class="ic" onclick="backHome()">←</button><div class="av" id="cav" style="width:36px;height:36px">U</div><div><b id="ctitle">Chat</b><small id="stxt" style="color:#00a884;display:block;font-size:11px">online</small></div></div>
      <div><button class="ic" onclick="startCall(false)">📞</button><button class="ic" onclick="startCall(true)">📹</button><button class="ic" onclick="clearChat()">🧹</button></div>
    </div>
    <div class="msgs" id="msgs"></div>
    <div id="ebar"></div>
    <div id="rbar"><span id="rtxt"></span><button class="ic" onclick="cancelReply()">✕</button></div>
    <div class="bar">
      <div class="inp"><button class="ic" onclick="toggleEmoji()">😊</button><input id="minp" placeholder="Message" oninput="typing()" onkeydown="if(event.key==='Enter')sendOrMic()"><label class="ic">📷<input type="file" accept="image/*" style="display:none" onchange="sendImg(this)"></label></div>
      <button id="mbtn" class="go" onclick="sendOrMic()">🎤</button>
    </div>
  </div>
  <div class="modal" id="new-modal" onclick="this.style.display='none'">
    <div class="mcard" onclick="event.stopPropagation()">
      <h3 style="color:#00a884">New Chat</h3>
      <input id="peer-num" type="tel" maxlength="10" placeholder="Saamne wale ka number">
      <input id="peer-nick" placeholder="Contact Name">
      <button class="w-btn" onclick="startPeerChat()">Start Chat</button>
    </div>
  </div>
  <div id="call-ui">
    <video id="remote-vid" autoplay playsinline></video>
    <video id="local-vid" autoplay playsinline muted></video>
    <div class="call-info"><h3 id="call-peer">Calling...</h3><p id="call-state" style="color:#00a884;font-size:13px">Ringing...</p></div>
    <div class="call-ctrls" id="incoming-ctrls" style="display:none"><button class="cbtn" style="background:#00a884" onclick="acceptCall()">📞</button><button class="cbtn" style="background:#ef4444" onclick="endCall()">📵</button></div>
    <div class="call-ctrls" id="active-ctrls"><button class="cbtn" id="mute-btn" style="background:#374248" onclick="toggleMute()">🎤</button><button class="cbtn" id="cam-btn" style="background:#374248" onclick="toggleCam()">📷</button><button class="cbtn" style="background:#374248" onclick="switchCam()">🔄</button><button class="cbtn" style="background:#ef4444" onclick="endCall()">📵</button></div>
  </div>
</div>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyAIBl_IH3ei_Z5vKpCZuWOiSpgrPotRN3Q",
  authDomain: "my-private-account-1e33f.firebaseapp.com",
  databaseURL: "https://my-private-account-1e33f-default-rtdb.firebaseio.com",
  projectId: "my-private-account-1e33f",
  storageBucket: "my-private-account-1e33f.firebasestorage.app",
  messagingSenderId: "127706318874",
  appId: "1:127706318874:web:2a0b014cdb83dae30a69a3"
});
const db = firebase.database();

let myNum = localStorage.getItem("wa_mynum") || "", myName = localStorage.getItem("wa_myname") || "";
let contacts = JSON.parse(localStorage.getItem("wa_contacts") || "[]");
let room = "", peerTitle = "", reply = null, rec = null, chunks = [], isRec = false, tOut = null;
let pc = null, localStream = null, isVideoCall = false, ringTimer = null, iceQueue = [], useFront = true;
const rtcCfg = { iceServers: [
  { urls: "stun:stun.l.google.com:19302" },
  { urls: "turn:openrelay.metered.ca:80", username: "openrelayproject", credential: "openrelayproject" },
  { urls: "turn:openrelay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" }
]};

function goScr(id) { document.querySelectorAll(".scr").forEach(s => s.style.display = "none"); document.getElementById(id).style.display = "flex"; }
if (myNum && myName) { renderHome(); goScr("s-home"); }

function saveNum() {
  let n = document.getElementById("my-num").value.replace(/\D/g, "");
  if (n.length < 4) return alert("Sahi mobile number likhein!");
  myNum = n; localStorage.setItem("wa_mynum", myNum); goScr("s-prof");
}
function finishSetup() {
  let nm = document.getElementById("my-name").value.trim();
  if (!nm) return alert("Apna naam likhein!");
  myName = nm; localStorage.setItem("wa_myname", myName); renderHome(); goScr("s-home");
}
function logoutWA() { if (confirm("Logout karein?")) { localStorage.removeItem("wa_mynum"); localStorage.removeItem("wa_myname"); location.reload(); } }
function openNewChat() { document.getElementById("new-modal").style.display = "flex"; }

function startPeerChat() {
  let pNum = document.getElementById("peer-num").value.replace(/\D/g, "");
  let pNick = document.getElementById("peer-nick").value.trim() || ("+91 " + pNum);
  if (pNum.length < 4) return alert("Saamne wale ka number likhein!");
  document.getElementById("new-modal").style.display = "none";
  let pairRoom = [myNum, pNum].sort().join("_");
  if (!contacts.find(c => c.num === pNum)) {
    contacts.unshift({ num: pNum, name: pNick, room: pairRoom });
    localStorage.setItem("wa_contacts", JSON.stringify(contacts));
  }
  renderHome(); openChatRoom(pairRoom, pNick);
}

function renderHome() {
  let list = document.getElementById("clist");
  list.innerHTML = contacts.length ? contacts.map(c => `<div class="c-item" onclick="openChatRoom('${c.room}','${c.name}')"><div class="av">${c.name[0].toUpperCase()}</div><div><b>${c.name}</b><div style="font-size:12px;color:#8696a0">+91 ${c.num}</div></div></div>`).join("") : `<div style="text-align:center;padding:50px 20px;color:#8696a0">Niche <b>+</b> dabakar number daalein!</div>`;
}

function openChatRoom(rId, title) {
  room = rId; peerTitle = title; ctitle.innerText = title; cav.innerText = title[0].toUpperCase(); msgs.innerHTML = ""; goScr("s-chat");
  db.ref("rooms/" + room).off(); db.ref("typing/" + room).off(); db.ref("calls/" + room).off(); db.ref("calls/" + room + "/ice").off();
  db.ref("typing/" + room).on("value", s => { let v = s.val(); stxt.innerText = (v && v.d !== myNum && v.t) ? "typing..." : "online"; });
  db.ref("rooms/" + room).on("child_added", s => {
    let d = s.val(), k = s.key, mine = d.d === myNum, div = document.createElement("div");
    div.id = "m_" + k; div.className = "m " + (mine ? "me" : "other"); div.innerHTML = drawMsg(d, mine);
    div.onclick = () => msgAction(k, d, mine); msgs.appendChild(div); msgs.scrollTop = msgs.scrollHeight;
  });
  db.ref("rooms/" + room).on("child_changed", s => { let el = document.getElementById("m_" + s.key); if (el) el.innerHTML = drawMsg(s.val(), s.val().d === myNum); });
  listenCalls();
}
function backHome() { db.ref("rooms/" + room).off(); goScr("s-home"); }

["😀🥺","😂🤣🤔","🥰🤣","😘😟","😎😭","😭","👍","🙏","❤️","🔥","🎉","💯"].forEach(e => { let s = document.createElement("span"); s.innerText = e; s.onclick = () => { minp.value += e; typing(); }; ebar.appendChild(s); });

function drawMsg(d, mine) {
  if (d.del) return `<i style="color:#8696a0">🚫 Message deleted</i>`;
  let h = mine ? "" : `<div class="snd">${d.u}</div>`;
  if (d.rep) h += `<div class="q"><b>${d.rep.u}:</b> ${d.rep.t}</div>`;
  if (d.img) h += `<img src="${d.img}">`;
  if (d.aud) h += `<audio controls src="${d.aud}"></audio>`;
  if (d.txt) h += `<div>${d.txt}</div>`;
  return h + `<div class="tm">${d.tm || ""} ${mine ? `<span style="color:#53bdeb">✓✓</span>` : ""}</div>`;
}

function typing() {
  let has = minp.value.trim().length > 0; if (!isRec) mbtn.innerText = has ? "➤" : "🎤";
  db.ref("typing/" + room).set({ u: myName, d: myNum, t: has });
  clearTimeout(tOut); tOut = setTimeout(() => db.ref("typing/" + room).set({ u: myName, d: myNum, t: false }), 1500);
}
function sendOrMic() {
  let txt = minp.value.trim();
  if (txt) {
    let p = { u: myName, d: myNum, txt: txt, tm: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) };
    if (reply) { p.rep = reply; cancelReply(); }
    db.ref("rooms/" + room).push(p); minp.value = ""; typing();
  } else toggleMic();
}
async function toggleMic() {
  if (!isRec) {
    try {
      let st = await navigator.mediaDevices.getUserMedia({ audio: true });
      rec = new MediaRecorder(st); chunks = []; rec.ondataavailable = e => chunks.push(e.data);
      rec.onstop = () => {
        let r = new FileReader();
        r.onloadend = () => db.ref("rooms/" + room).push({ u: myName, d: myNum, aud: r.result, tm: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) });
        r.readAsDataURL(new Blob(chunks, { type: "audio/webm" })); st.getTracks().forEach(t => t.stop());
      };
      rec.start(); isRec = true; mbtn.style.background = "#ef4444"; mbtn.innerText = "⏹";
    } catch (e) { alert("Mic permission allow karein"); }
  } else { rec.stop(); isRec = false; mbtn.style.background = "#00a884"; mbtn.innerText = "🎤"; }
}
function sendImg(inp) {
  let f = inp.files[0]; if (!f) return;
  let r = new FileReader();
  r.onload = ev => {
    let im = new Image();
    im.onload = () => {
      let c = document.createElement("canvas"), sc = Math.min(1, 550 / im.width);
      c.width = im.width * sc; c.height = im.height * sc; c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      db.ref("rooms/" + room).push({ u: myName, d: myNum, img: c.toDataURL("image/jpeg", 0.6), tm: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) });
    }; im.src = ev.target.result;
  }; r.readAsDataURL(f); inp.value = "";
}
function msgAction(k, d, mine) {
  if (d.del) return;
  if (mine && confirm("Delete message? (Cancel = Reply)")) db.ref("rooms/" + room + "/" + k).update({ del: true, txt: "", img: null, aud: null });
  else { reply = { u: d.u, t: d.txt || (d.img ? "📷 Photo" : "🎤 Voice") }; rtxt.innerText = "Replying to " + d.u + ": " + reply.t; rbar.style.display = "flex"; minp.focus(); }
}
function cancelReply() { reply = null; rbar.style.display = "none"; }
function toggleEmoji() { ebar.style.display = ebar.style.display === "flex" ? "none" : "flex"; }
function clearChat() { if (confirm("Clear chat?")) { db.ref("rooms/" + room).remove(); msgs.innerHTML = ""; } }

// HD Video & Audio Call
async function getHDMedia(v) { return await navigator.mediaDevices.getUserMedia({ audio: true, video: v ? { facingMode: useFront ? "user" : "environment", width: { ideal: 1280 }, height: { ideal: 720 } } : false }); }
function playRing() { try { let c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain(); o.frequency.value = 520; g.gain.value = 0.08; o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + 0.35); } catch (e) {} }

async function startCall(v) {
  isVideoCall = v; iceQueue = [];
  try { localStream = await getHDMedia(v); } catch (e) { return alert("Camera/Mic permission Allow karein!"); }
  showCallUI(peerTitle, v ? "HD Video Calling..." : "Audio Calling...", false);
  localVid.srcObject = localStream; localVid.style.display = v ? "block" : "none"; camBtn.style.display = v ? "inline-block" : "none";
  await db.ref("calls/" + room).remove(); setupPeer();
  let offer = await pc.createOffer(); await pc.setLocalDescription(offer);
  await db.ref("calls/" + room).set({ from: myName, fromId: myNum, video: v, offer: { type: offer.type, sdp: offer.sdp } });
}
function listenCalls() {
  db.ref("calls/" + room).on("value", async snap => {
    const val = snap.val();
    if (!val) { if (callUi.style.display === "flex") closeCallLocal(); return; }
    if (val.offer && val.fromId !== myNum && !pc && !window._inc) {
      window._inc = true; isVideoCall = val.video; window._off = val.offer;
      showCallUI(val.from, val.video ? "Incoming HD Video Call..." : "Incoming Audio Call...", true);
      ringTimer = setInterval(playRing, 1500);
    }
    if (val.answer && val.fromId === myNum && pc && !pc.currentRemoteDescription) {
      await pc.setRemoteDescription(new RTCSessionDescription(val.answer)); flushIce(); callState.innerText = "Connected (HD)";
    }
  });
  db.ref("calls/" + room + "/ice").on("child_added", async snap => {
    let ice = snap.val();
    if (ice && ice.by !== myNum) {
      if (pc && pc.remoteDescription) { try { await pc.addIceCandidate(new RTCIceCandidate(ice.cand)); } catch (e) {} }
      else iceQueue.push(ice.cand);
    }
  });
}
async function flushIce() { while (iceQueue.length) { try { await pc.addIceCandidate(new RTCIceCandidate(iceQueue.shift())); } catch (e) {} } }
async function acceptCall() {
  clearInterval(ringTimer);
  try { localStream = await getHDMedia(isVideoCall); } catch (e) { alert("Permission Allow karein!"); return endCall(); }
  incomingCtrls.style.display = "none"; activeCtrls.style.display = "flex";
  localVid.srcObject = localStream; localVid.style.display = isVideoCall ? "block" : "none"; camBtn.style.display = isVideoCall ? "inline-block" : "none";
  setupPeer(); await pc.setRemoteDescription(new RTCSessionDescription(window._off)); await flushIce();
  let ans = await pc.createAnswer(); await pc.setLocalDescription(ans);
  await db.ref("calls/" + room).update({ answer: { type: ans.type, sdp: ans.sdp } }); callState.innerText = "Connected (HD)";
}
function setupPeer() {
  pc = new RTCPeerConnection(rtcCfg); localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  pc.ontrack = e => { if (e.streams && e.streams[0]) { remoteVid.srcObject = e.streams[0]; remoteVid.play().catch(()=>{}); } };
  pc.onicecandidate = e => { if (e.candidate) db.ref("calls/" + room + "/ice").push({ by: myNum, cand: e.candidate.toJSON() }); };
}
function showCallUI(t, s, inc) { callUi.style.display = "flex"; callPeer.innerText = t; callState.innerText = s; incomingCtrls.style.display = inc ? "flex" : "none"; activeCtrls.style.display = inc ? "none" : "flex"; }
function endCall() { db.ref("calls/" + room).remove(); closeCallLocal(); }
function closeCallLocal() { clearInterval(ringTimer); window._inc = false; iceQueue = []; if (pc) { pc.close(); pc = null; } if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; } remoteVid.srcObject = null; localVid.srcObject = null; callUi.style.display = "none"; }
function toggleMute() { if (!localStream) return; let t = localStream.getAudioTracks()[0]; t.enabled = !t.enabled; muteBtn.style.background = t.enabled ? "#374248" : "#ef4444"; }
function toggleCam() { if (!localStream) return; let t = localStream.getVideoTracks()[0]; if (t) { t.enabled = !t.enabled; camBtn.style.background = t.enabled ? "#374248" : "#ef4444"; } }
async function switchCam() {
  if (!isVideoCall || !localStream || !pc) return;
  useFront = !useFront; localStream.getVideoTracks().forEach(t => t.stop());
  let newSt = await getHDMedia(true), newT = newSt.getVideoTracks()[0];
  let s = pc.getSenders().find(x => x.track && x.track.kind === "video"); if (s) s.replaceTrack(newT);
  localVid.srcObject = newSt; localVid.style.transform = useFront ? "scaleX(-1)" : "none";
}
const callUi = document.getElementById("call-ui"), remoteVid = document.getElementById("remote-vid"), localVid = document.getElementById("local-vid"), callPeer = document.getElementById("call-peer"), callState = document.getElementById("call-state"), incomingCtrls = document.getElementById("incoming-ctrls"), activeCtrls = document.getElementById("active-ctrls"), muteBtn = document.getElementById("mute-btn"), camBtn = document.getElementById("cam-btn");
</script>
</body>
</html>
